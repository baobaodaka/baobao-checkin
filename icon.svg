<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d97b"/>
      <stop offset="1" stop-color="#1fae5e"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 完成进度环（约 76%） -->
  <circle cx="256" cy="232" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="26"/>
  <circle cx="256" cy="232" r="150" fill="none" stroke="#ffffff" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="716 943"
          transform="rotate(-90 256 232)"/>

  <!-- 白底徽章 -->
  <circle cx="256" cy="232" r="126" fill="#ffffff"/>
  <!-- 绿色对勾徽章 -->
  <circle cx="256" cy="232" r="112" fill="url(#badge)"/>
  <!-- 对勾 -->
  <path d="M196 244 L240 290 L326 192" fill="none" stroke="#ffffff"
        stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 小星星点缀 -->
  <path d="M404 96 C 410 122, 426 138, 452 144 C 426 150, 410 166, 404 192
           C 398 166, 382 150, 356 144 C 382 138, 398 122, 404 96 Z"
        fill="#ffd83d"/>
  <circle cx="96" cy="120" r="12" fill="#ffffff" fill-opacity="0.85"/>
</svg>
